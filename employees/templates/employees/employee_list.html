{% extends 'employees/base.html' %}
{% block content %}

<!-- Header Row -->
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">

  <!-- Page Title -->
  <h3 class="m-0">Employees</h3>

  <!-- Buttons -->
  <div class="d-flex gap-2 flex-wrap buttons-bar">
    <a href="{% url 'add_employee' %}" class="btn btn-primary btn-sm">+ Add</a>
    <a href="{% url 'import_excel' %}" class="btn btn-success btn-sm">Import</a>
    <a href="{% url 'export_excel' %}" class="btn btn-warning btn-sm">Export</a>
  </div>
</div>

<!-- ✅ Search Bar -->
<form method="get" class="mb-3 w-100">
  <div class="input-group search-bar">
    <input type="text" name="search" value="{{ search }}" placeholder="Search employees..." class="form-control">
    <button class="btn btn-dark">Search</button>
  </div>
</form>

<!-- Table -->
<div class="card-box table-shadow">
  <div class="table-responsive">
    <table class="table align-middle text-center table-bordered">

      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for e in employees %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ e.name }}</td>
          <td>{{ e.email }}</td>
          <td>{{ e.role }}</td>

          <td class="d-flex justify-content-center gap-2 flex-wrap">
            <a class="btn btn-sm btn-warning" href="{% url 'edit_employee' e.id %}">Edit</a>

            <form action="{% url 'delete_employee' e.id %}" method="POST">
              {% csrf_token %}
              <button class="btn btn-sm btn-danger">Delete</button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="5" class="text-center">No employees found</td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>
</div>

<style>
/* ✅ Desktop: Buttons stay on right side */
.buttons-bar {
  margin-left: auto;
}
.search-bar .form-control:focus {
  box-shadow: 0 0 8px rgba(0,0,0,0.15) !important;
  border-color: #000 !important;
}



/* ✅ Desktop/Laptop: Search Bar full width */
@media(min-width: 992px){
  .search-bar {
    max-width: 100% !important;
  }
}

/* ✅ Mobile/Tablets: Normal width search bar */
@media(max-width: 991px){
  .search-bar {
    max-width: 400px;
  }
}

/* ✅ Small screens - button spacing */
@media(max-width: 768px){
  .btn-sm {
    margin-bottom: 5px;
    min-width: 90px;
  }
  .buttons-bar {
    width: 100%;
    justify-content: flex-start;
    margin-top: 6px;
  }
}
</style>

{% endblock %}
