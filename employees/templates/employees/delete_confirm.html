{% extends 'employees/base.html' %}
{% block content %}
<div class="card-box" style="max-width:600px;">
  {% if employee %}
    <h4>Delete employee: {{ employee.name }} ?</h4>
  {% elif task %}
    <h4>Delete task: {{ task.title }} ?</h4>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, Delete</button>
    <a class="btn btn-secondary" href="javascript:history.back()">Cancel</a>
  </form>
</div>
{% endblock %}
