{% extends 'employees/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg p-4" style="border-radius: 12px;">
        <h2 class="fw-bold mb-4">Add Employee</h2>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Name</label>
                {{ form.name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label">Role</label>
                {{ form.role }}
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                {{ form.phone }}
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <a href="{% url 'employee_list' %}" class="btn btn-dark">Back</a>
        </form>
    </div>
</div>

<style>
    .form-control {
        border-radius: 8px;
        padding: 10px;
    }
</style>
{% endblock %}
